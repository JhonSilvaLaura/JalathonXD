apiVersion: v1
kind: Service
metadata:
  name: jhonbrayansilva-service
  namespace: jhonbrayansilva
  labels:
    app: jhonbrayansilva
    tier: backend
spec:
  type: LoadBalancer
  selector:
    app: jhonbrayansilva
    tier: backend
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 38080
  sessionAffinity: ClientIP