apiVersion: apps/v1
kind: Deployment
metadata:
  name: jhonbrayansilva-deployment
  namespace: jhonbrayansilva
  labels:
    app: jhonbrayansilva
    tier: backend
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jhonbrayansilva
      tier: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jhonbrayansilva
        tier: backend
        version: "1.0"
    spec:
      containers:
      - name: jhonbrayansilva
        image: jhonbrayansilvalaura/sjflasdfsf:1.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: jhonbrayansilva-secrets
              key: DB_URL
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: jhonbrayansilva-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jhonbrayansilva-secrets
              key: DB_PASSWORD
        - name: SERVER_PORT
          valueFrom:
            secretKeyRef:
              name: jhonbrayansilva-secrets
              key: SERVER_PORT
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/studentes
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/studentes
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always