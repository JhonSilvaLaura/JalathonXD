services:
  # Backend Spring WebFlux
  backend:
    image: jhonbrayansilvalaura/sjflasdfsf:1.0
    container_name: sjflasdfsf-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Credenciales de Neon Database (Cloud)
      DB_URL: r2dbc:postgresql://asdlf;jadslfasfd/asdfasd?sslmode=require
      DB_USERNAME: asdfa
      DB_PASSWORD: adfasdfasdfas
      SERVER_PORT: 8080
    networks:
      - sjflasdfsf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/studentes"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


networks:
  sjflasdfsf-network:
    driver: bridge
